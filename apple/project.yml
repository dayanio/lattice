name: LatticeApple
options:
  bundleIdPrefix: io.lattice
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: JN4AC4DDAU
    CODE_SIGN_IDENTITY: "Apple Development"

targets:
  Lattice:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Lattice
      - path: Shared
    dependencies:
      - target: LatticeTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lattice.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: entitlements/Lattice.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES

  LatticeMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LatticeMac
      - path: Shared
    dependencies:
      - target: LatticeTunnelMac
      - framework: Frameworks/LatticeCore.xcframework
        embed: true
    info:
      path: LatticeMac/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lattice.mac
        CODE_SIGN_ENTITLEMENTS: entitlements/LatticeMac.entitlements
        COMBINE_HIDPI_IMAGES: YES

  LatticeTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LatticeTunnel
      - path: Shared/TunnelCore.swift
    info:
      path: LatticeTunnel/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lattice.ios.tunnel
        CODE_SIGN_ENTITLEMENTS: entitlements/LatticeTunnel.entitlements

  LatticeTunnelMac:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LatticeTunnelMac
      - path: Shared/TunnelCore.swift
    dependencies:
      - framework: Frameworks/LatticeCore.xcframework
        embed: false
    info:
      path: LatticeTunnelMac/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: io.lattice.mac.tunnel
        CODE_SIGN_ENTITLEMENTS: entitlements/LatticeTunnelMac.entitlements

schemes:
  Lattice:
    build:
      targets:
        Lattice: all
        LatticeTunnel: all
  LatticeMac:
    build:
      targets:
        LatticeMac: all
        LatticeTunnelMac: all
