name: LatticeApple
options:
  bundleIdPrefix: io.lattice
  deploymentTarget:
    iOS: "17.0"
    # gomobile hardcodes the current SDK (26.0) as the engine framework's
    # minos for macOS; aligning the app target silences the mismatch warning.
    # Lower this together with a post-bind vtool step when older macOS matters.
    macOS: "26.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: JN4AC4DDAU
    CODE_SIGN_IDENTITY: "Apple Development"
    # Xcode 26's swbuild debug-dylib splitting turns the embedded gomobile
    # framework binary into a stub pointing into the build temp dir, which is
    # deleted after the session — the extension then crashes at launch.
    ENABLE_DEBUG_DYLIB: NO

packages:
  LatticeCastKit:
    path: ../../lattice-cast/swift/LatticeCastKit
  PlayerKit:
    path: ../../PlayerKit

targets:
  Lattice:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Lattice
      - path: Shared
    dependencies:
      - target: LatticeTunnel
      - package: LatticeCastKit
        product: LatticeCastKit
      - package: PlayerKit
        product: PlayerKit
      - package: PlayerKit
        product: PlayerKitNative
      - framework: Frameworks/iOS/LatticeCore.xcframework
        # The iOS slice is a STATIC library (gomobile) — the engine is linked
        # into LatticeTunnel at build time, so embedding the framework in the
        # app only leaves an ar-archive that installd refuses to parse.
        embed: false
    info:
      path: Lattice/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: "Lattice 需要使用摄像头扫描入网二维码"
        NSLocalNetworkUsageDescription: "Lattice 需要访问本地网络以与网内设备互传文件和通信"
        NSMicrophoneUsageDescription: "语音输入需要使用麦克风"
        NSSpeechRecognitionUsageDescription: "语音转文字在本机完成，音频不会上传"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lattice.ios
        CODE_SIGN_ENTITLEMENTS: entitlements/Lattice.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic

  LatticeMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LatticeMac
      - path: Shared
    dependencies:
      - target: LatticeTunnelMac
      - package: LatticeCastKit
        product: LatticeCastKit
      - framework: Frameworks/MacOS/LatticeCore.xcframework
        embed: true
    info:
      path: LatticeMac/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSUIElement: true
        NSCameraUsageDescription: Lattice 需要使用摄像头扫描入网二维码
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lattice.mac
        CODE_SIGN_ENTITLEMENTS: entitlements/LatticeMac.entitlements
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
    postBuildScripts:
      # Xcode 26's swbuild engine stubs the embedded gomobile framework binary
      # (points it into the build temp dir, deleted after the session) so a
      # rebuilt app crashes its tunnel at launch. Restore the real binary and
      # re-seal signatures after every build.
      - name: Restore LatticeCore engine binary
        script: |
          set -e
          SRC_BIN="${SRCROOT}/Frameworks/MacOS/LatticeCore.xcframework/macos-arm64_x86_64/LatticeCore.framework/Versions/A/LatticeCore"
          EMB_BIN="${BUILT_PRODUCTS_DIR}/LatticeMac.app/Contents/Frameworks/LatticeCore.framework/Versions/A/LatticeCore"
          if [ -f "${EMB_BIN}" ] && ! cmp -s "${SRC_BIN}" "${EMB_BIN}"; then
            cp -f "${SRC_BIN}" "${EMB_BIN}"
            codesign --force --sign "${CODE_SIGN_IDENTITY}" "${EMB_BIN%/LatticeCore}"
            codesign --force --sign "${CODE_SIGN_IDENTITY}" --entitlements "${SRCROOT}/entitlements/LatticeMac.entitlements" "${BUILT_PRODUCTS_DIR}/LatticeMac.app"
          fi

  LatticeTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LatticeTunnel
      - path: Shared/TunnelCore.swift
    dependencies:
      - framework: Frameworks/iOS/LatticeCore.xcframework
        embed: false
    info:
      path: LatticeTunnel/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lattice.ios.tunnel
        CODE_SIGN_ENTITLEMENTS: entitlements/LatticeTunnel.entitlements
        CODE_SIGN_STYLE: Automatic

  LatticeTunnelMac:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: LatticeTunnelMac
      - path: Shared/TunnelCore.swift
    dependencies:
      - framework: Frameworks/MacOS/LatticeCore.xcframework
        embed: false
    info:
      path: LatticeTunnelMac/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: io.lattice.mac.tunnel
        CODE_SIGN_ENTITLEMENTS: entitlements/LatticeTunnelMac.entitlements
        CODE_SIGN_STYLE: Automatic

schemes:
  Lattice:
    build:
      targets:
        Lattice: all
        LatticeTunnel: all
  LatticeMac:
    build:
      targets:
        LatticeMac: all
        LatticeTunnelMac: all
